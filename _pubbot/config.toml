# Publication bot settings for MagmaThermoKinematics.jl (see README.md).

[scan]
# How far back each scan looks. DOIs already on the page or in seen_dois.txt
# are skipped, so a generous window only costs API calls.
lookback_months = 18
# OpenAlex work types considered publications.
types = ["article", "preprint", "conference-paper", "book-chapter", "review", "letter"]
# Also look at papers by anyone that cite a package paper (`dois` below). Citing alone is
# only worth a review: Schmitt et al. (2023) is also cited for its zircon age spectra.
citing_core = true
# Also look at papers by anyone whose full text (OpenAlex index) names a package.
search_mentions = true
# Most users of MagmaThermoKinematics are not its developers: a paper that names the package
# is listed whoever wrote it.
require_team = false
# Repository copies and data deposits of papers, never listed.
ignore_doi_prefixes = [
    "10.5281/",   # Zenodo
    "10.3929/",   # ETH Research Collection
    "10.17863/",  # Cambridge Apollo
    "10.14459/",  # mediaTUM
    "10.6084/",   # figshare
]
# Titles never listed (regular expressions, case-insensitive).
ignore_titles = ['^thank you to our', '^comment on ', '^reply to ', '^correction to ', '^erratum']

# Preprint servers: DOI prefix => name used in the entry ("<name> (preprint)").
[preprint_servers]
"10.5194/egusphere-" = "EGUsphere"
"10.48550/arxiv." = "arXiv"
"10.22541/essoar." = "ESS Open Archive"
"10.1002/essoar." = "ESS Open Archive"
"10.21203/rs." = "Research Square"
"10.31223/" = "EarthArXiv"
"10.2139/ssrn." = "SSRN"

# Misspelled author names found in publisher metadata: wrong => right.
[author_fixes]
"de Monserrat" = "de Montserrat"

# A paper "uses" a package when its full text, title or abstract mentions one of `match`
# (case-sensitive, whole word), or when it cites one of `dois` (then only for review).
[[package]]
name = "MagmaThermoKinematics.jl"
tier = "core"
match = ["MagmaThermoKinematics"]
dois = [
    "10.1130/ges02563.1",   # Schmitt et al. (2023), the reference given in the README
]
