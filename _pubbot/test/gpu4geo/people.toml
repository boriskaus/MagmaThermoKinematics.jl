# People whose publications the scan looks for (seeded from team.md).
#
# Two groups:
#   - GPU4GEO PIs and co-PIs: their papers count on use of the Julia stack alone.
#   - People whose papers must acknowledge the project (`requires_acknowledgment = true`),
#     because most of their output is unrelated to GPU4GEO. Another person from this file
#     as co-author lifts that requirement. Terms: [acknowledgment] in config.toml.
#
# `since = "YYYY-MM-DD"` (optional) ignores that person's papers published earlier.

